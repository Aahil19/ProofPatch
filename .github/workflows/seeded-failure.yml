name: Seeded failure (intentional)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seeded-failure.yml'

permissions:
  contents: read

jobs:
  broken-python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - name: Intentionally fail five tests for the URL-ingestion demonstration
        working-directory: examples/buggy_stats
        run: python -m pytest -q
