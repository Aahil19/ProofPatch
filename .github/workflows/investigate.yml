name: Investigate GitHub failure

on:
  workflow_run:
    workflows: ['Seeded failure (intentional)']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_url:
        description: URL of a completed failed GitHub Actions run
        required: true
        type: string
      subdir:
        description: Python project directory within the repository
        default: '.'
        type: string
      provider:
        description: Use demo only for the bundled buggy_stats fixture
        default: openai
        type: choice
        options: [openai, demo]
      model:
        description: OpenAI model ID (required for openai; uses API credits)
        type: string
      input_price_per_million:
        description: USD per million input tokens for the selected model (required for openai)
        type: string
      output_price_per_million:
        description: USD per million output tokens for the selected model (required for openai)
        type: string
      resume_from_run_id:
        description: Optional previous investigation run ID with an interrupted checkpoint artifact
        type: string

permissions:
  contents: read
  actions: read

jobs:
  investigate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted controller code, never the failed run's code
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e .
      - run: docker build -t proofpatch-runner:0.2 docker
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != ''
        with:
          name: proofpatch-github-investigation
          path: artifacts
          run-id: ${{ inputs.resume_from_run_id }}
          github-token: ${{ github.token }}
      - name: Ingest URL and investigate through MCP and Docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || inputs.run_url }}
          SUBDIR: ${{ github.event_name == 'workflow_run' && 'examples/buggy_stats' || inputs.subdir }}
          PROVIDER: ${{ github.event_name == 'workflow_run' && 'demo' || inputs.provider }}
          MODEL: ${{ inputs.model }}
          INPUT_RATE: ${{ inputs.input_price_per_million }}
          OUTPUT_RATE: ${{ inputs.output_price_per_million }}
          RESUME_RUN_ID: ${{ inputs.resume_from_run_id }}
        run: |
          resume_args=()
          if [ -n "$RESUME_RUN_ID" ]; then
            resume_args=(--resume)
          fi
          if [ "$PROVIDER" = openai ]; then
            proofpatch "$RUN_URL" --subdir "$SUBDIR" --provider openai --model "$MODEL" \
              --input-price-per-million "$INPUT_RATE" --output-price-per-million "$OUTPUT_RATE" \
              --output artifacts/github-run "${resume_args[@]}"
          else
            proofpatch "$RUN_URL" --subdir "$SUBDIR" --provider demo \
              --output artifacts/github-run "${resume_args[@]}"
          fi
      - name: Publish decision and evidence
        if: always()
        run: python scripts/github_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofpatch-github-investigation
          path: artifacts/
          if-no-files-found: warn
