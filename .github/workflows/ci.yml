name: Week 1 evidence checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=artifacts/unit-tests.xml
      - name: Demonstrate a real failure-to-fix with scripted agent responses
        run: python scripts/check_demo.py --output artifacts/ci-demo
      - name: Prove insufficient evidence is escalated
        run: python scripts/check_escalation.py --output artifacts/ci-escalation
      - name: Publish evidence in job summary
        if: always()
        run: |
          if [ -f artifacts/ci-demo/report.md ]; then
            cat artifacts/ci-demo/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofpatch-evidence-python-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error
