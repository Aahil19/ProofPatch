name: Evidence checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=artifacts/unit-tests.xml
      - name: Demonstrate a real failure-to-fix with scripted agent responses
        run: python scripts/check_demo.py --output artifacts/ci-demo
      - name: Prove insufficient evidence is escalated
        run: python scripts/check_escalation.py --output artifacts/ci-escalation
      - name: Publish evidence in job summary
        if: always()
        run: python scripts/github_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofpatch-evidence-python-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error

  docker-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: docker build -t proofpatch-runner:0.2 docker
      - name: Real container isolation and MCP integration checks
        env:
          PROOFPATCH_DOCKER_TESTS: '1'
        run: pytest -q tests/test_docker.py --junitxml=artifacts/docker-tests.xml
      - name: Produce MCP and Docker evidence
        run: proofpatch examples/buggy_stats --provider demo --execution docker --output artifacts/ci-docker
      - name: Publish evidence summary
        if: always()
        run: python scripts/github_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofpatch-docker-mcp-evidence
          path: artifacts/
          if-no-files-found: error

  guardrail-injections:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e .
      - name: Inject budget, MCP outage, and deadline failures
        run: python scripts/check_guardrails.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofpatch-guardrail-injections
          path: artifacts/guardrail-injections/
          if-no-files-found: error
