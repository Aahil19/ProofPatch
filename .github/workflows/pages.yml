name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'benchmarks/results.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Validate static dashboard
        run: |
          test -f dashboard/index.html
          test -f dashboard/data/benchmark-results.json
          python -m json.tool dashboard/data/benchmark-results.json > /dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
