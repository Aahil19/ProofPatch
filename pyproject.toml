[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpatch"
version = "0.4.0"
description = "Evidence-first multi-agent repair of Python test failures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.15", "pydantic==2.14.1", "openai==3.31.0", "pytest==9.1.1", "mcp==1.30.0", "httpx==0.28.1", "mlflow-skinny==3.17.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.0"]

[project.scripts]
proofpatch = "proofpatch.cli:main"
proofpatch-mcp = "proofpatch.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
